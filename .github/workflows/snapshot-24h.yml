name: Instantanés civicAPI (24 h)
# Cinq passages de ~5 h 45 qui s'enchaînent (un seul à la fois), jusqu'à l'heure de fin ci-dessous.
# Même groupe que l'autre robot : démarre dès que le passage en cours s'arrête, sans chevauchement.
on:
  workflow_dispatch:
concurrency:
  group: snapshot
  cancel-in-progress: false
permissions:
  contents: write
env:
  END_UTC: "2026-11-05T06:00:00Z"   # jeudi 5 novembre, 07:00 heure suisse
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        passage: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les résultats en continu
        run: |
          git config user.name "midterms-bot"
          git config user.email "midterms-bot@users.noreply.github.com"
          stop=$(date -d "$END_UTC" +%s)
          end=$(( $(date +%s) + 345*60 )); [ "$stop" -lt "$end" ] && end=$stop
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            git pull -q --rebase -X theirs || true
            out=$(python3 scripts/snapshot.py 2>&1 || true); echo "$out"
            if [ -n "$(git status --porcelain data)" ]; then
              git add data && git commit -q -m "Instantané résultats $(date -u +%H:%M:%S)" || true
              git pull -q --rebase -X theirs || true
              git push -q || true
            fi
            if echo "$out" | grep -q erreur; then pause=8; else pause=30; fi
            elapsed=$(( $(date +%s) - start ))
            [ "$elapsed" -lt "$pause" ] && sleep $(( pause - elapsed ))
          done
          echo "Passage ${{ matrix.passage }} terminé"
