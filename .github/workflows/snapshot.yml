name: Instantanés civicAPI
# Un seul passage tourne en continu ~5 h 45 (récupération toutes les ~45 s).
# Le déclenchement planifié ne sert que de relance si le passage en cours s'arrête.
on:
  workflow_dispatch:
concurrency:
  group: snapshot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les résultats en continu
        run: |
          git config user.name "midterms-bot"
          git config user.email "midterms-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 345*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            out=$(python3 scripts/snapshot.py 2>&1 || true); echo "$out"
            if [ -n "$(git status --porcelain data)" ]; then
              git add data && git commit -q -m "Instantané résultats $(date -u +%H:%M:%S)" || true
              git pull -q --rebase -X theirs || true
              git push -q || true
            fi
            # civicAPI tombe souvent ce soir : nouvel essai après 8 s en cas d'échec, sinon toutes les 30 s
            if echo "$out" | grep -q erreur; then pause=8; else pause=30; fi
            elapsed=$(( $(date +%s) - start ))
            [ "$elapsed" -lt "$pause" ] && sleep $(( pause - elapsed ))
          done
