<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midterms 2026 · Home</title>
<!--
  Bandeau compact « Midterms 2026 » pour la homepage : Chambre + Sénat, sans carte,
  avec un bouton vers l'article complet.
  Données : civicAPI (https://civicapi.org) — attribution obligatoire.

  Paramètres d'URL :
    url   = adresse de l'article complet (ouvert dans la page, pas dans l'iframe)
    lang  = fr | de
    theme = dark | light          (défaut : suit l'appareil)
    demo  = 1                     (chiffres fictifs pour tester)
-->
<style>
  /* Proposition 3 « Bandeau rouge Blick » : fond fixe, identique sur le site clair et sombre */
  :root{
    --d:#1b73a5; --r:#e20000; --brand:#e20000;
    --pending:#d6d6d6;
    --ink:#111; --muted:#666; --line:#ddd; --bg:#f6f5f3; --on-ink:#fff;
    --d-text:#1b73a5; --r-text:#e20000; --hatch:rgba(255,255,255,.55);
    --font:"BlickVariable","GT America",Arial,Helvetica,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}

  .redhead{background:var(--brand);color:#fff}
  .redhead .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .kicker{font-size:22px;line-height:1.1;font-weight:800;letter-spacing:-.01em;margin:0}
  .live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.04em;
    color:var(--brand);background:#fff;border-radius:3px;padding:2px 6px;text-transform:uppercase}
  .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand);animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}
  .wrap{max-width:1100px;margin:0 auto;padding:14px 16px 14px}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
  .col{min-width:0;border-top:2px solid var(--ink);padding-top:10px}
  .col h2{margin:0 0 8px;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
  .col h2 a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  .col h2 a:hover{text-decoration:underline}
  .col h2 svg{width:13px;height:13px}

  .gauge-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:6px}
  .side{font-weight:800;line-height:1.05}
  .side .n{font-size:36px;display:block;font-variant-numeric:tabular-nums}
  .side .p{font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
  .side.d{color:var(--d-text)} .side.r{color:var(--r-text);text-align:right}
  .mid{font-size:13px;color:var(--muted);text-align:center;padding-bottom:4px}

  .bar{position:relative;display:flex;height:22px;background:var(--pending);border-radius:3px;overflow:hidden}
  .bar span{height:100%;transition:flex-basis .5s ease}
  .bar .seg-d{background:var(--d)} .bar .seg-r{background:var(--r)}
  .bar .seg-p{flex:1 1 auto}
  /* Sièges non renouvelés : couleur du parti, hachurée */
  .bar .hd{background:repeating-linear-gradient(-55deg,var(--d) 0 5px,var(--hatch) 5px 7px),var(--d)}
  .bar .hr{background:repeating-linear-gradient(-55deg,var(--r) 0 5px,var(--hatch) 5px 7px),var(--r)}
  .bar .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
  .gauge-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:6px}
  .gauge-foot i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .gauge-foot i.hatch{background:repeating-linear-gradient(-55deg,var(--muted) 0 3px,transparent 3px 5px);box-shadow:inset 0 0 0 1px var(--muted)}
  .gauge-foot i.pend{background:var(--pending)}

  .foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px 16px;margin-top:14px;
    border-top:1px solid var(--line);padding-top:10px}
  .foot .meta{font-size:12px;color:var(--muted)}
  .foot .meta a{color:inherit}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;text-decoration:none;
    font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;white-space:nowrap;border:2px solid var(--brand)}
  .btn:hover{background:#fff;color:var(--brand)}
  .btn svg{width:16px;height:16px}

  @media (max-width:700px){
    .kicker{font-size:20px}
    .cols{grid-template-columns:1fr;gap:16px}
    .side .n{font-size:30px}
    .btn{width:100%;justify-content:center}
  }
  @media (prefers-reduced-motion:reduce){ .bar span{transition:none} .live::before{animation:none} }
</style>
</head>
<body>
<div class="redhead"><div class="in"><p class="kicker">Midterms 2026</p><span class="live">Live</span></div></div>
<div class="wrap">
  
  <div class="cols">
    <section class="col" id="house"></section>
    <section class="col" id="senate"></section>
  </div>
  <div class="foot">
    <span class="meta" id="meta"></span>
    <a class="btn" id="cta" target="_top"></a>
  </div>
</div>

<script>
(function(){
  "use strict";
  var ELECTION_DATE = "2026-11-03";
  var API = "https://civicapi.org/api/v2/race/search";
  var REFRESH_MS = 60000, RETRY_MS = 15000, TIMEOUT_MS = 20000;
  // Sièges du Sénat non renouvelés en 2026 (indépendants King et Sanders comptés côté D)
  var SENATE_HOLDOVER = { D: 34, R: 31 };

  var qs = new URLSearchParams(location.search);
  var LANG = qs.get("lang") === "de" ? "de" : "fr";
  var DEMO = qs.get("demo") === "1";
  // Article complet par défaut (utilisé si l'URL ne précise pas ?url=)
  var URL_ARTICLE = qs.get("url") || "https://www.blick.ch/fr/monde/cartes-interactives-suivez-les-resultats-des-midterms-2026-en-direct/72h2lnp";
  var THEME = qs.get("theme");
  document.documentElement.lang = LANG;
  // Fond fixe : le paramètre theme et les messages de thème sont ignorés
  window.addEventListener("message", function(e){
    var t = e && e.data && e.data.midtermsTheme;
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    else if (t === "auto") document.documentElement.removeAttribute("data-theme");
  });

  var T = {
    fr: { house: "Chambre des représentants", senate: "Sénat", dem: "Démocrates", rep: "Républicains",
      left: function(n){ return n + " non attribué" + (n > 1 ? "s" : ""); },
      notUp: function(n){ return n + " sièges non renouvelés"; },
      updated: function(t){ return "Mis à jour à " + t + " · Source : "; },
      loading: "Chargement des résultats… · Source : ",
      majority: function(n){ return n + " pour la majorité"; },
      cta: "Voir tous les résultats" },
    de: { house: "Repräsentantenhaus", senate: "Senat", dem: "Demokraten", rep: "Republikaner",
      left: function(n){ return n + " noch offen"; },
      notUp: function(n){ return n + " Sitze nicht zur Wahl"; },
      updated: function(t){ return "Aktualisiert um " + t + " · Quelle: "; },
      loading: "Resultate werden geladen… · Quelle: ",
      majority: function(n){ return n + " für die Mehrheit"; },
      cta: "Alle Resultate" }
  }[LANG];

  var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';
  var CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
  var $ = function(id){ return document.getElementById(id); };
  var cta = $("cta");
  cta.href = URL_ARTICLE; cta.innerHTML = T.cta + ARROW;

  function partyKey(p){ p = (p || "").toLowerCase(); return p.indexOf("democrat") >= 0 ? "D" : p.indexOf("republican") >= 0 ? "R" : "O"; }

  // Comme Le Monde : on ne compte que les sièges attribués (vainqueur annoncé)
  function count(races){
    var c = { D: 0, R: 0, O: 0, n: races.length };
    races.forEach(function(r){
      var w = (r.candidates || []).filter(function(x){ return x.winner; })[0];
      if (w) c[partyKey(w.party)]++;
    });
    return c;
  }

  function block(id, title, c, total, majority, hold){
    var pct = function(n){ return (n / total * 100).toFixed(3) + "%"; };
    var dTot = c.D + (hold ? hold.D : 0), rTot = c.R + (hold ? hold.R : 0);
    var n = c.n || (hold ? 35 : 435);   // avant le premier chargement : nombre de sièges en jeu
    var left = n - c.D - c.R - c.O;
    var seg = function(cls, k){ return k > 0 ? '<span class="' + cls + '" style="flex:0 0 ' + pct(k) + '"></span>' : ""; };
    $(id).innerHTML =
      '<h2><a href="' + URL_ARTICLE + '" target="_top">' + title + CHEV + "</a></h2>" +
      '<div class="gauge-head">' +
        '<div class="side d"><span class="n">' + dTot + '</span><span class="p">' + T.dem + "</span></div>" +
        '<div class="mid">' + T.majority(majority) + "</div>" +
        '<div class="side r"><span class="n">' + rTot + '</span><span class="p">' + T.rep + "</span></div>" +
      "</div>" +
      '<div class="bar">' +
        (hold ? seg("hd", hold.D) : "") + seg("seg-d", c.D) + '<span class="seg-p"></span>' +
        seg("seg-r", c.R) + (hold ? seg("hr", hold.R) : "") +
        '<span class="tick" style="left:calc(' + pct(majority) + ' - 1px)"></span>' +
      "</div>" +
      '<div class="gauge-foot"><span><i class="pend"></i>' + T.left(left) + "</span>" +
        (hold ? '<span><i class="hatch"></i>' + T.notUp(hold.D + hold.R) + "</span>" : "") + "</div>";
  }

  function hhmm(ts){ return new Date(ts).toLocaleTimeString("fr-CH", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Zurich" }); }
  function setMeta(text){ $("meta").innerHTML = text + '<a href="https://civicapi.org" target="_blank" rel="noopener">civicAPI</a>'; }

  function render(races, at){
    if (DEMO) races = demoize(races);
    var house = races.filter(function(r){ return r.type === "House of Representatives"; });
    var senate = races.filter(function(r){ return r.type === "US Senate"; });
    // Seuils repris de la présentation du Monde : 218 à la Chambre, 50 au Sénat
    block("house", T.house, count(house), 435, 218, null);
    block("senate", T.senate, count(senate), 100, 50, SENATE_HOLDOVER);
    setMeta(T.updated(hhmm(at || Date.now())));
  }

  function demoize(races){
    var s = 12345, rnd = function(){ s = (s * 9301 + 49297) % 233280; return s / 233280; };
    return races.map(function(r){
      var c = JSON.parse(JSON.stringify(r)), win = rnd() < .6, d = rnd() < .5;
      (c.candidates || []).forEach(function(k){ k.winner = win && partyKey(k.party) === (d ? "D" : "R"); });
      return c;
    });
  }

  // Cache partagé avec la carte complète (même domaine) : affichage immédiat
  var KEY = "midterms2026:" + ELECTION_DATE + ":General";
  function readCache(){ try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); return v && v.races ? v : null; } catch(e){ return null; } }
  function writeCache(races){ try { localStorage.setItem(KEY, JSON.stringify({ races: races, at: Date.now() })); } catch(e){} }
  var NOT_STATE = ["US","PR","GU","VI","AS","MP","DC"];
  function slim(races){
    var keep = { "US Senate": 1, "House of Representatives": 1, "Governor": 1 };
    return races.filter(function(r){ return keep[r.type] && r.province && NOT_STATE.indexOf(r.province) < 0; }).map(function(r){
      return { type: r.type, province: r.province, district: r.district, percent_reporting: r.percent_reporting,
        candidates: (r.candidates || []).map(function(c){ return { name: c.name, party: c.party, votes: c.votes, percent: c.percent, winner: c.winner }; }) };
    });
  }

  var timer = null;
  function refresh(){
    clearTimeout(timer);
    if (typeof showSnap === "function") showSnap();
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var to = ctrl ? setTimeout(function(){ ctrl.abort(); }, TIMEOUT_MS) : null;
    var url = API + "?startDate=" + ELECTION_DATE + "&endDate=" + ELECTION_DATE + "&country=US&election_type=General&limit=50000";
    fetch(url, { cache: "no-store", signal: ctrl ? ctrl.signal : undefined })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){ clearTimeout(to); var races = slim(j.races || []); writeCache(races); shownAt = Date.now(); render(races); timer = setTimeout(refresh, REFRESH_MS); })
      .catch(function(){ clearTimeout(to); var c = readCache(); if (c) setMeta(T.updated(hhmm(c.at))); showSnap(); timer = setTimeout(refresh, RETRY_MS); });
  }

  var cached = readCache(), shownAt = cached ? cached.at : 0;
  if (cached) render(cached.races, cached.at);
  else { render([]); setMeta(T.loading); }
  // Instantané publié sur notre site par le robot GitHub : affichage immédiat, même sur iPhone
  function showSnap(){
    fetch("data/general.json", { cache: "no-cache" }).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if (j && j.races && j.races.length && (j.at || 0) > shownAt) { shownAt = j.at; render(j.races, j.at); } })
      .catch(function(){});
  }
  showSnap();
  refresh();
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) refresh(); });
})();
</script>
<script src="https://www.blick.ch/assets/iframeHeightAdjustment.js"></script>
</body>
</html>
