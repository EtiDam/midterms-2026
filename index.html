<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>

<title>Midterms 2026</title>
<!--
  Module « Midterms 2026 » — carte tilegram des États américains.
  Données : civicAPI (https://civicapi.org) — attribution obligatoire, conservée en pied de module.
  Gabarit des hexagones repris du module Blick US 2024 (utils.blick.ch/static/visuals/us/).

  Paramètres d'URL :
    lang   = fr | de                     (défaut : fr)
    race   = senate | house | governor   (défaut : senate)
    layout = home                        (version compacte pour la homepage, sans onglets)
    demo   = 1                           (résultats fictifs aléatoires, pour tester le rendu)
    theme  = dark | light                (défaut : suit le mode clair/sombre de l'appareil)
    bg     = transparent                 (fond transparent, prend celui de la page)

  Exemples :
    index.html?lang=fr
    index.html?lang=de&race=house
    index.html?lang=fr&layout=home&race=senate
-->
<style>
  :root{
    --d:#1b73a5; --d-prov:#4eaace;
    --r:#e20000; --r-prov:#fb8163;
    --o:#8a8a8a; --o-prov:#c5c5c5;
    --pending:#d6d6d6; --norace:#fff; --norace-line:#c9c9c9;
    --ink:#111; --muted:#666; --line:#ddd; --bg:#f6f5f3; --brand:#e20000; --tab-bg:#fff;
    --on-ink:#fff; --track:#eee; --lab-pending:#4a4a4a; --lab-faint:#c9c9c9; --d-text:#1b73a5; --r-text:#e20000;
    --font:"BlickVariable","GT America",Arial,Helvetica,sans-serif;
  }
  /* Thème sombre : suit l'appareil du lecteur, ou forcé avec ?theme=dark / ?theme=light */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --pending:#4a4a4a; --norace:transparent; --norace-line:#555;
      --ink:#f2f2f2; --muted:#a0a0a0; --line:#333; --bg:#111; --tab-bg:#111;
      --on-ink:#111; --track:#2a2a2a; --lab-pending:#e6e6e6; --lab-faint:#666;
      --o:#9a9a9a; --d-text:#5fb6e0; --r-text:#ff4a4a; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --pending:#4a4a4a; --norace:transparent; --norace-line:#555;
    --ink:#f2f2f2; --muted:#a0a0a0; --line:#333; --bg:#111; --tab-bg:#111;
    --on-ink:#111; --track:#2a2a2a; --lab-pending:#e6e6e6; --lab-faint:#666;
    --o:#9a9a9a; --d-text:#5fb6e0; --r-text:#ff4a4a; color-scheme:dark;
  }
  *{box-sizing:border-box}
  html.bg-transparent,html.bg-transparent body{background:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
  .wrap{max-width:1000px;margin:0 auto;padding:16px}
  .layout-home .wrap{padding:8px 12px}

  /* En-tête rouge Blick (comme le bandeau de la home) */
  .redhead{background:var(--brand);color:#fff}
  .redhead .in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  h1{font-size:24px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.01em}
  .live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.04em;
    color:var(--brand);background:#fff;border-radius:3px;padding:2px 6px;text-transform:uppercase}
  .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand);animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){ .live::before{animation:none} }
  .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
  .layout-home h1{font-size:19px}
  .layout-home .redhead .in{padding:8px 12px}
  .layout-home .sub{display:none}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
  .tabs button{font:inherit;font-size:14px;font-weight:700;border:2px solid var(--ink);background:var(--tab-bg);color:var(--ink);
    padding:7px 12px;border-radius:999px;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
  /* Home : onglets compacts sur une seule ligne */
  .layout-home .tabs{margin:0 0 10px;gap:4px;flex-wrap:nowrap}
  .layout-home .tabs button{font-size:13px;padding:5px 10px;border-width:1.5px;white-space:nowrap}

  /* Jauge */
  .gauge-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:6px}
  .side{font-weight:800;line-height:1.05}
  .side .n{font-size:40px;display:block}
  .side .p{font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
  .side.d{color:var(--d-text)} .side.r{color:var(--r-text);text-align:right}
  .mid{font-size:13px;color:var(--muted);text-align:center;padding-bottom:4px}
  .layout-home .side .n{font-size:30px}
  .bar{position:relative;display:flex;height:22px;background:var(--pending);border-radius:3px;overflow:hidden}
  .bar span{height:100%;transition:width .5s ease}
  .bar .sd{background:var(--d)} .bar .sdp{background:var(--d-prov)}
  .bar .sp{flex:1}
  .bar .srp{background:var(--r-prov)} .bar .sr{background:var(--r)}
  .bar .so{background:var(--o)}
  .bar .maj{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
  #gauge{min-height:112px}
  .gauge-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;gap:8px}

  /* Carte */
  .map{margin:14px 0 4px}
  .map svg{display:block;width:100%;height:auto;overflow:visible}
  .hex{cursor:pointer;fill:var(--pending);stroke:var(--bg);stroke-width:5;transition:fill .4s ease}
  .hex:focus,.st:focus{outline:none}
  /* Chargement : les hexagones « respirent » doucement au lieu de rester figés */
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
  .map.loading .hex{animation:breathe 1.2s ease-in-out infinite}
  .map.loading .st:nth-child(3n) .hex{animation-delay:.2s}
  .map.loading .st:nth-child(3n+1) .hex{animation-delay:.4s}
  @media (prefers-reduced-motion:reduce){ .map.loading .hex{animation:none;opacity:.6} }
  .outline{fill:none;stroke:var(--bg);stroke-width:5;pointer-events:none}
  .st.sel .outline,.st:focus-visible .outline{stroke:var(--ink);stroke-width:8}
  .stripes{pointer-events:none}
  .stripes .sep{stroke:var(--bg);stroke-width:1.5;opacity:.55}
  .num{font-family:var(--font);font-size:24px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:#fff;
    paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:5px}
  .st.house .lab{paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:6px;fill:#fff}
  .lab{font-family:var(--font);font-size:36px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:#fff}
  .lab.dark{fill:var(--lab-pending)} .lab.faint{fill:var(--lab-faint);font-weight:400}
  /* État sans élection pour ce poste : hexagone vide en pointillés, non cliquable */
  .st.none .hex{fill:var(--norace)!important;stroke:var(--norace-line);stroke-width:3;stroke-dasharray:10 8;cursor:default}
  .st.none{cursor:default}
  .st.none .outline{display:none}
  @media (max-width:600px){ .lab{font-size:46px} .num{font-size:30px} .side .n{font-size:30px} h1{font-size:22px} }

  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);justify-content:center;margin:6px 0 10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  .layout-home .legend{margin-bottom:4px}

  /* Détail d'un État */
  /* Hauteur fixe : le bloc ne change jamais de taille d'un État à l'autre (pas de saut de page ni d'iframe) */
  .detail{border-top:2px solid var(--ink);padding:12px 0 0;height:190px;overflow:hidden}
  /* Avant la première interaction : bloc réduit à une ligne (pas d'espace vide sous la carte) */
  .detail.collapsed{height:auto;padding-bottom:4px}
  .detail h2{font-size:18px;line-height:22px;height:22px;margin:0 0 2px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .detail .meta{font-size:12px;line-height:16px;height:16px;color:var(--muted);margin-bottom:10px}
  .detail .hint{font-size:14px;line-height:20px;color:var(--muted);margin:0}
  .cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;height:34px;margin-bottom:5px;font-size:15px;line-height:20px}
  .cand.empty{visibility:hidden}
  .cand .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .cand .pc.na{color:var(--muted);font-weight:400}
  .cand .nm small{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
  .cand .pc{font-weight:800;font-variant-numeric:tabular-nums}
  .cand .tr{grid-column:1/-1;height:6px;background:var(--track);border-radius:3px;overflow:hidden}
  .cand .tr b{display:block;height:100%}
  .win{display:inline-block;font-size:11px;font-weight:800;color:var(--on-ink);background:var(--ink);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px;text-transform:uppercase}
  .layout-home .detail{display:none}

  .foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
  .foot a{color:inherit}
  .err{color:var(--r)}
</style>
</head>
<body>
<div class="redhead"><div class="in"><h1 id="title"></h1><span class="live">Live</span></div></div>
<div class="wrap">
  <p class="sub" id="sub"></p>
  <div class="tabs" role="tablist" id="tabs"></div>

  <section id="gauge" aria-live="polite"></section>

  <div class="map" id="map"></div>
  <div class="legend" id="legend"></div>
  <div class="detail" id="detail"></div>

  <div class="foot">
    <span id="source"></span>
    <span id="updated"></span>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ------------------------------------------------------------------
     Réglages
  ------------------------------------------------------------------ */
  var ELECTION_DATE = "2026-11-03";
  var API = "https://civicapi.org/api/v2/race/search";
  var REFRESH_MS = 60000;

  // Sièges du Sénat qui ne sont PAS renouvelés en 2026 (100 − 35 en jeu).
  // Indépendants qui siègent avec les démocrates (King, Sanders) comptés côté D.
  // À vérifier avant publication si la composition du Sénat a changé.
  var SENATE_HOLDOVER = { D: 34, R: 31 };

  /* ------------------------------------------------------------------
     Paramètres d'URL
  ------------------------------------------------------------------ */
  var qs = new URLSearchParams(location.search);
  var LANG = qs.get("lang") === "de" ? "de" : "fr";
  var HOME = qs.get("layout") === "home";
  var DEMO = qs.get("demo") === "1";
  var RACE = ["senate","house","governor"].indexOf(qs.get("race")) >= 0 ? qs.get("race") : "senate";
  document.documentElement.lang = LANG;
  if (HOME) document.body.classList.add("layout-home");
  var THEME = qs.get("theme");
  if (THEME === "dark" || THEME === "light") document.documentElement.setAttribute("data-theme", THEME);
  // ?bg=transparent : le fond du module laisse voir celui de la page Blick
  if (qs.get("bg") === "transparent") { document.documentElement.style.setProperty("--bg-page", "transparent"); document.documentElement.classList.add("bg-transparent"); }

  /* ------------------------------------------------------------------
     Textes
  ------------------------------------------------------------------ */
  var T = {
    fr: {
      title: "Midterms 2026",
      sub: "Résultats en direct des élections de mi-mandat aux États-Unis, État par État.",
      tabs: { senate: "Sénat", house: "Chambre des représentants", governor: "Gouverneurs" },
      tabsShort: { senate: "Sénat", house: "Chambre", governor: "Gouverneurs" },
      homeTitle: { senate: "Midterms : le Sénat", house: "Midterms : la Chambre", governor: "Midterms : les gouverneurs" },
      dem: "Démocrates", rep: "Républicains", oth: "Autres",
      seats: "sièges", races: "élections",
      majority: function(n){ return n + " pour la majorité"; },
      undecided: function(n){ return n + " non attribués"; },
      notUp: function(d,r){ return "Dont non renouvelés : " + d + " D, " + r + " R"; },
      leading: function(d,r,u){ return "En tête : " + d + " D, " + r + " R"; },
      govTotal: function(n){ return n + " postes de gouverneur en jeu"; },
      legend: { def: "Élu", prov: "En tête", pending: "Pas encore de résultat", none: "Pas d'élection en 2026" },
      reporting: function(p){ return p + " % des votes dépouillés"; },
      firstVotes: "Premières voix, moins de 1 % dépouillé",
      noRace: "Pas d'élection pour ce poste dans cet État en 2026.",
      pending: "Pas encore de résultats.",
      hint: "Touchez ou survolez un État pour voir les résultats.",
      winner: "Élu",
      houseLead: function(t){ return t + (t > 1 ? " sièges dans cet État" : " siège dans cet État"); },
      elected: "élus", leading2: "en tête", pendingSeats: "Pas encore de résultat",
      source: "Source : ",
      updated: function(t){ return "Mis à jour à " + t; },
      error: "Impossible de charger les résultats pour le moment.",
      loading: "Chargement des résultats…",
      stale: function(t){ return "Source lente : résultats de " + t + ", nouvel essai en cours"; },
      demo: " (DÉMO — données fictives)"
    },
    de: {
      title: "Midterms 2026",
      sub: "Live-Resultate der US-Zwischenwahlen, Bundesstaat für Bundesstaat.",
      tabs: { senate: "Senat", house: "Repräsentantenhaus", governor: "Gouverneure" },
      tabsShort: { senate: "Senat", house: "Repräsentantenhaus", governor: "Gouverneure" },
      homeTitle: { senate: "Midterms: der Senat", house: "Midterms: das Repräsentantenhaus", governor: "Midterms: die Gouverneure" },
      dem: "Demokraten", rep: "Republikaner", oth: "Andere",
      seats: "Sitze", races: "Wahlen",
      majority: function(n){ return n + " für die Mehrheit"; },
      undecided: function(n){ return n + " noch offen"; },
      notUp: function(d,r){ return "Davon nicht zur Wahl: " + d + " D, " + r + " R"; },
      leading: function(d,r,u){ return "Führend: " + d + " D, " + r + " R"; },
      govTotal: function(n){ return n + " Gouverneursposten zur Wahl"; },
      legend: { def: "Gewählt", prov: "Führt", pending: "Noch kein Resultat", none: "Keine Wahl 2026" },
      reporting: function(p){ return p + " % der Stimmen ausgezählt"; },
      firstVotes: "Erste Stimmen, weniger als 1 % ausgezählt",
      noRace: "Keine Wahl für dieses Amt in diesem Bundesstaat 2026.",
      pending: "Noch keine Resultate.",
      hint: "Tippe oder fahre über einen Bundesstaat, um die Resultate zu sehen.",
      winner: "Gewählt",
      houseLead: function(t){ return t + (t > 1 ? " Sitze in diesem Bundesstaat" : " Sitz in diesem Bundesstaat"); },
      elected: "gewählt", leading2: "führend", pendingSeats: "Noch kein Resultat",
      source: "Quelle: ",
      updated: function(t){ return "Aktualisiert um " + t; },
      error: "Die Resultate können im Moment nicht geladen werden.",
      loading: "Resultate werden geladen…",
      stale: function(t){ return "Quelle langsam: Resultate von " + t + ", neuer Versuch läuft"; },
      demo: " (DEMO – fiktive Daten)"
    }
  }[LANG];

  var NAMES = {
    AL:["Alabama","Alabama"],AK:["Alaska","Alaska"],AZ:["Arizona","Arizona"],AR:["Arkansas","Arkansas"],
    CA:["Californie","Kalifornien"],CO:["Colorado","Colorado"],CT:["Connecticut","Connecticut"],
    DE:["Delaware","Delaware"],DC:["District de Columbia","District of Columbia"],FL:["Floride","Florida"],
    GA:["Géorgie","Georgia"],HI:["Hawaï","Hawaii"],ID:["Idaho","Idaho"],IL:["Illinois","Illinois"],
    IN:["Indiana","Indiana"],IA:["Iowa","Iowa"],KS:["Kansas","Kansas"],KY:["Kentucky","Kentucky"],
    LA:["Louisiane","Louisiana"],ME:["Maine","Maine"],MD:["Maryland","Maryland"],MA:["Massachusetts","Massachusetts"],
    MI:["Michigan","Michigan"],MN:["Minnesota","Minnesota"],MS:["Mississippi","Mississippi"],MO:["Missouri","Missouri"],
    MT:["Montana","Montana"],NE:["Nebraska","Nebraska"],NV:["Nevada","Nevada"],NH:["New Hampshire","New Hampshire"],
    NJ:["New Jersey","New Jersey"],NM:["Nouveau-Mexique","New Mexico"],NY:["New York","New York"],
    NC:["Caroline du Nord","North Carolina"],ND:["Dakota du Nord","North Dakota"],OH:["Ohio","Ohio"],
    OK:["Oklahoma","Oklahoma"],OR:["Oregon","Oregon"],PA:["Pennsylvanie","Pennsylvania"],RI:["Rhode Island","Rhode Island"],
    SC:["Caroline du Sud","South Carolina"],SD:["Dakota du Sud","South Dakota"],TN:["Tennessee","Tennessee"],
    TX:["Texas","Texas"],UT:["Utah","Utah"],VT:["Vermont","Vermont"],VA:["Virginie","Virginia"],
    WA:["Washington","Washington"],WV:["Virginie-Occidentale","West Virginia"],WI:["Wisconsin","Wisconsin"],WY:["Wyoming","Wyoming"]
  };
  function stateName(s){ return (NAMES[s] || [s,s])[LANG === "de" ? 1 : 0]; }

  /* ------------------------------------------------------------------
     Gabarit tilegram (centres des hexagones, repris du module Blick 2024)
     Hexagones « pointe en haut » : demi-largeur 63,3, demi-hauteur 73,15.
  ------------------------------------------------------------------ */
  var HEX = "WA:143.7,327 OR:143.7,570.6 CA:214,692.5 ID:214,448.6 WY:354.8,448.6 SD:495.5,449 AZ:425.1,814.5 " +
    "NM:495.5,692.6 MT:284.4,326.9 ND:425.1,327 LA:706.6,814.5 TN:917.6,692.6 MS:847.3,814.5 AL:988.1,814.5 " +
    "GA:1128.8,814.5 WV:988.1,570.6 VA:1128.8,570.6 NC:1058.4,692.6 SC:1199.1,692.6 FL:1058.4,936.5 " +
    "DC:1339.8,692.6 PA:1199.1,449 MD:1269.4,570.7 DE:1410.2,570.7 NJ:1339.8,448.6 NY:1269.5,326.8 " +
    "CT:1480.6,448.6 MA:1410.2,326.8 VT:1339.8,205.1 NH:1480.6,205.1 RI:1550.9,326.8 OK:565.9,814.5 " +
    "TX:636.2,936.5 MN:565.9,327 AR:777,692.6 NV:284.4,570.6 NE:565.9,570.6 UT:354.8,692.6 CO:425.1,570.7 " +
    "KY:847.3,570.6 KS:636.3,692.6 IA:636.3,448.6 MO:706.6,570.6 IL:777,448.6 WI:706.6,326.9 MI:988.1,327 " +
    "IN:917.6,448.6 ME:1550.9,83.1 AK:73.3,83.1 HI:73.3,936.5 OH:1058.4,448.6";
  var TILES = HEX.split(" ").map(function(s){
    var a = s.split(":"), c = a[1].split(",");
    return { st: a[0], x: +c[0], y: +c[1] };
  });
  var W = 63.3, H1 = 36.55, H2 = 73.15;
  function hexPoints(x, y){
    return [[x+W,y+H1],[x+W,y-H1],[x,y-H2],[x-W,y-H1],[x-W,y+H1],[x,y+H2]]
      .map(function(p){ return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
  }

  /* ------------------------------------------------------------------
     Données
  ------------------------------------------------------------------ */
  var COLORS = {
    D: { def: "var(--d)", prov: "var(--d-prov)" },
    R: { def: "var(--r)", prov: "var(--r-prov)" },
    O: { def: "var(--o)", prov: "var(--o-prov)" }
  };
  function partyKey(p){
    p = (p || "").toLowerCase();
    if (p.indexOf("democrat") >= 0) return "D";
    if (p.indexOf("republican") >= 0) return "R";
    return "O";
  }
  function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }

  // Résumé d'une course : statut (none / pending / prov / def), parti en tête ou élu
  function summarize(race){
    if (!race) return { status: "none" };
    var cands = (race.candidates || []).slice().sort(function(a,b){ return num(b.percent) - num(a.percent) || num(b.votes) - num(a.votes); });
    var win = cands.filter(function(c){ return c.winner; })[0];
    var rep = num(race.percent_reporting);
    if (win) return { status: "def", party: partyKey(win.party), cands: cands, reporting: rep, race: race };
    // « En tête » dès les premières voix, même si l'API indique encore 0 % dépouillé (ex. villages du New Hampshire à minuit)
    if (cands.length && num(cands[0].votes) > 0) return { status: "prov", party: partyKey(cands[0].party), cands: cands, reporting: rep, race: race };
    return { status: "pending", cands: cands, reporting: rep, race: race };
  }

  /* ------------------------------------------------------------------
     Chargement avec cache : la carte s'affiche tout de suite avec les dernières
     données connues (mémoire, puis navigateur du lecteur), puis se met à jour
     dès que civicAPI répond. Utile quand l'API est lente ou saturée.
  ------------------------------------------------------------------ */
  var FETCH_TIMEOUT_MS = 20000;   // on abandonne une requête au-delà de 20 s
  var RETRY_MS = 15000;           // en cas d'échec, nouvel essai après 15 s
  var KEEP = { "US Senate": 1, "House of Representatives": 1, "Governor": 1 };
  var mem = {};                    // { General: {races, at}, Statewide: {races, at} }

  function slim(races){
    // On ne garde que ce dont la carte a besoin (allège le stockage local)
    return races.filter(function(r){ return KEEP[r.type] && NAMES[r.province]; }).map(function(r){
      return { type: r.type, province: r.province, district: r.district, percent_reporting: r.percent_reporting,
        candidates: (r.candidates || []).map(function(c){ return { name: c.name, party: c.party, votes: c.votes, percent: c.percent, winner: c.winner }; }) };
    });
  }
  function storeKey(t){ return "midterms2026:" + ELECTION_DATE + ":" + t; }
  function readCache(t){
    if (mem[t]) return mem[t];
    try { var v = JSON.parse(localStorage.getItem(storeKey(t)) || "null"); if (v && v.races) { mem[t] = v; return v; } } catch(e){}
    return null;
  }
  function writeCache(t, races){
    var v = { races: races, at: Date.now() }; mem[t] = v;
    try { localStorage.setItem(storeKey(t), JSON.stringify(v)); } catch(e){}
  }

  function fetchType(electionType){
    var url = API + "?startDate=" + ELECTION_DATE + "&endDate=" + ELECTION_DATE +
      "&country=US&election_type=" + electionType + "&limit=50000";
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var to = ctrl ? setTimeout(function(){ ctrl.abort(); }, FETCH_TIMEOUT_MS) : null;
    return fetch(url, { cache: "no-store", signal: ctrl ? ctrl.signal : undefined }).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function(j){
      clearTimeout(to);
      var races = slim(j.races || []);
      writeCache(electionType, races);
      return races;
    }, function(e){ clearTimeout(to); throw e; });
  }

  function typeFor(race){ return race === "governor" ? "Statewide" : "General"; }
  function pick(races){
    var want = RACE === "governor" ? "Governor" : RACE === "senate" ? "US Senate" : "House of Representatives";
    return races.filter(function(r){ return r.type === want; });
  }
  function load(){ return fetchType(typeFor(RACE)).then(pick); }

  /* ------------------------------------------------------------------
     Mode démo : résultats fictifs pour tester le rendu
  ------------------------------------------------------------------ */
  var demoSeed = Date.now();
  function demoize(races){
    var rnd = (function(s){ return function(){ s = (s * 9301 + 49297) % 233280; return s / 233280; }; })(demoSeed % 233280);
    return races.map(function(r){
      var c = JSON.parse(JSON.stringify(r));
      var x = rnd(), rep = x < .2 ? 0 : Math.min(100, Math.round(rnd() * 100));
      var total = 0;
      (c.candidates || []).forEach(function(k){ var v = Math.round(rnd() * 100000 * (partyKey(k.party) === "O" ? .15 : 1)); k.votes = v; total += v; });
      (c.candidates || []).forEach(function(k){ k.percent = total ? Math.round(k.votes / total * 1000) / 10 : 0; k.winner = false; });
      c.percent_reporting = rep;
      if (rep > 70 && c.candidates && c.candidates.length) {
        var best = c.candidates.slice().sort(function(a,b){ return b.votes - a.votes; })[0];
        best.winner = true;
      }
      if (rep === 0) (c.candidates || []).forEach(function(k){ k.votes = 0; k.percent = 0; });
      return c;
    });
  }

  /* ------------------------------------------------------------------
     Rendu
  ------------------------------------------------------------------ */
  var $ = function(id){ return document.getElementById(id); };
  var selected = null, lastStates = {};

  function renderChrome(){
    $("title").textContent = HOME ? T.homeTitle[RACE] : T.title;
    $("sub").textContent = T.sub + (DEMO ? T.demo : "");
    if (HOME && DEMO) $("title").textContent += T.demo;
    var tabs = $("tabs"); tabs.innerHTML = "";
    ["senate","house","governor"].forEach(function(k){
      var b = document.createElement("button");
      b.type = "button"; b.setAttribute("role","tab");
      b.setAttribute("aria-selected", k === RACE ? "true" : "false");
      b.textContent = (HOME ? T.tabsShort : T.tabs)[k];
      b.onclick = function(){ if (k !== RACE){ RACE = k; selected = null; renderChrome(); switchRace(); } };
      tabs.appendChild(b);
    });
    $("source").innerHTML = T.source + '<a href="https://civicapi.org" target="_blank" rel="noopener">civicAPI</a>';
    var L = T.legend;
    $("legend").innerHTML =
      '<span><i style="background:var(--d)"></i><i style="background:var(--r)"></i>' + L.def + '</span>' +
      '<span><i style="background:var(--d-prov)"></i><i style="background:var(--r-prov)"></i>' + L.prov + '</span>' +
      '<span><i style="background:var(--pending)"></i>' + L.pending + '</span>' +
      '<span><i style="background:var(--norace);border:1px dashed var(--norace-line)"></i>' + L.none + '</span>';
    $("detail").innerHTML = '<p class="hint">' + T.hint + '</p>';
    if (!detailOpened) $("detail").classList.add("collapsed");
  }

  function buildMap(){
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 1625 1020");
    svg.setAttribute("role", "img");
    var defs = document.createElementNS(ns, "defs"); svg.appendChild(defs);
    TILES.forEach(function(t){
      var g = document.createElementNS(ns, "g");
      g.setAttribute("class", "st"); g.setAttribute("data-st", t.st);
      g.setAttribute("tabindex", "0");
      var p = document.createElementNS(ns, "polygon");
      p.setAttribute("class", "hex"); p.setAttribute("points", hexPoints(t.x, t.y));
      // Chambre : bandes verticales (une par siège), découpées à la forme de l'hexagone
      var cp = document.createElementNS(ns, "clipPath"); cp.setAttribute("id", "clip-" + t.st);
      var cpp = document.createElementNS(ns, "polygon"); cpp.setAttribute("points", hexPoints(t.x, t.y));
      cp.appendChild(cpp); defs.appendChild(cp);
      var stripes = document.createElementNS(ns, "g");
      stripes.setAttribute("class", "stripes"); stripes.setAttribute("clip-path", "url(#clip-" + t.st + ")");
      var outline = document.createElementNS(ns, "polygon");
      outline.setAttribute("class", "outline"); outline.setAttribute("points", hexPoints(t.x, t.y));
      var tx = document.createElementNS(ns, "text");
      tx.setAttribute("class", "lab"); tx.setAttribute("x", t.x); tx.setAttribute("y", t.y);
      tx.textContent = t.st;
      var nb = document.createElementNS(ns, "text");
      nb.setAttribute("class", "num"); nb.setAttribute("x", t.x); nb.setAttribute("y", t.y + 30);
      var title = document.createElementNS(ns, "title"); title.textContent = stateName(t.st);
      g.appendChild(title); g.appendChild(p); g.appendChild(stripes); g.appendChild(outline); g.appendChild(tx); g.appendChild(nb);
      g._tile = t;
      g.addEventListener("mouseenter", function(){ if (!HOME && matchMedia("(hover:hover)").matches) showDetail(t.st); });
      g.addEventListener("click", function(){ if (!g.classList.contains("none") || RACE !== "house") select(t.st); });
      g.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); select(t.st); } });
      svg.appendChild(g);
    });
    $("map").innerHTML = ""; $("map").appendChild(svg);
  }

  function select(st){
    selected = st;
    document.querySelectorAll(".st").forEach(function(g){ g.classList.toggle("sel", g.getAttribute("data-st") === st); });
    showDetail(st);
  }

  function paint(states){
    lastStates = states;
    document.querySelectorAll(".st").forEach(function(g){
      var st = g.getAttribute("data-st"), s = states[st] || { status: "none" };
      var hex = g.querySelector(".hex"), lab = g.querySelector(".lab");
      var fill = s.status === "def" ? COLORS[s.party].def
               : s.status === "prov" ? COLORS[s.party].prov
               : s.status === "pending" ? "var(--pending)" : "var(--norace)";
      hex.style.fill = fill;
      g.classList.toggle("none", s.status === "none");
      lab.setAttribute("class", "lab" + (s.status === "pending" && !s.house ? " dark" : s.status === "none" ? " faint" : ""));
      drawStripes(g, s.house);
    });
    if (selected) showDetail(selected);
  }

  // Une bande par siège, dans l'ordre : D élu, D en tête, autres, en attente, R en tête, R élu
  function drawStripes(g, h){
    var box = g.querySelector(".stripes"), nb = g.querySelector(".num"), lab = g.querySelector(".lab"), t = g._tile;
    g.classList.toggle("house", !!h);
    box.innerHTML = ""; nb.textContent = "";
    lab.setAttribute("y", h ? t.y - 8 : t.y);
    if (!h) return;
    var pend = h.total - h.D - h.Dp - h.R - h.Rp - h.O;
    var seq = [], push = function(n, col){ for (var i = 0; i < n; i++) seq.push(col); };
    push(h.D, "var(--d)"); push(h.Dp, "var(--d-prov)"); push(h.O, "var(--o)");
    push(pend, "var(--pending)"); push(h.Rp, "var(--r-prov)"); push(h.R, "var(--r)");
    var ns = "http://www.w3.org/2000/svg", x0 = t.x - W, w = 2 * W / seq.length;
    seq.forEach(function(col, i){
      var r = document.createElementNS(ns, "rect");
      r.setAttribute("x", (x0 + i * w).toFixed(2)); r.setAttribute("y", t.y - H2);
      r.setAttribute("width", (w + 0.6).toFixed(2)); r.setAttribute("height", 2 * H2);
      r.setAttribute("fill", col); box.appendChild(r);
      // Séparateurs fins entre sièges, seulement s'ils restent lisibles
      if (i > 0 && seq.length <= 14) {
        var l = document.createElementNS(ns, "line");
        l.setAttribute("x1", (x0 + i * w).toFixed(2)); l.setAttribute("x2", (x0 + i * w).toFixed(2));
        l.setAttribute("y1", t.y - H2); l.setAttribute("y2", t.y + H2);
        l.setAttribute("class", "sep"); box.appendChild(l);
      }
    });
    nb.textContent = h.total;
  }

  // Le bloc s'ouvre à la première interaction, puis garde sa hauteur fixe pour toujours
  var detailOpened = false;
  function openDetail(){ if (!detailOpened) { detailOpened = true; $("detail").classList.remove("collapsed"); } }

  function showDetail(st){
    openDetail();
    var s = lastStates[st] || { status: "none" }, html = "<h2>" + stateName(st) + "</h2>";
    if (RACE === "house") {
      if (!s.house) { $("detail").innerHTML = html + '<p class="hint">' + T.pending + "</p>"; return; }
      var h = s.house, pend = h.total - h.D - h.Dp - h.R - h.Rp - h.O;
      html += '<div class="meta">' + T.houseLead(h.total) + "</div>";
      // Même gabarit que les autres onglets : 3 lignes à hauteur fixe
      var row = function(label, a, b, colA, colB){
        var tot = a + b;
        return '<div class="cand"><span class="nm">' + label + "<small>" + T.elected + " " + a + " · " + T.leading2 + " " + b + "</small></span>" +
          '<span class="pc">' + tot + "</span>" +
          '<span class="tr" style="display:flex"><b style="width:' + (a / h.total * 100) + "%;background:" + colA + '"></b>' +
          '<b style="width:' + (b / h.total * 100) + "%;background:" + colB + '"></b></span></div>';
      };
      html += row(T.dem, h.D, h.Dp, "var(--d)", "var(--d-prov)");
      html += row(T.rep, h.R, h.Rp, "var(--r)", "var(--r-prov)");
      html += '<div class="cand"><span class="nm">' + T.pendingSeats + (h.O ? "<small>" + T.oth + " " + h.O + "</small>" : "") +
        '</span><span class="pc">' + pend + '</span><span class="tr"><b style="width:' + (pend / h.total * 100) + '%;background:var(--pending)"></b></span></div>';
      $("detail").innerHTML = html; return;
    }
    if (s.status === "none") { $("detail").innerHTML = html + '<div class="meta"></div><p class="hint">' + T.noRace + "</p>"; return; }
    var noVotes = !(s.cands || []).some(function(c){ return num(c.votes) > 0; });
    html += '<div class="meta">' + (noVotes ? T.pending : (Math.round(s.reporting || 0) < 1 ? T.firstVotes : T.reporting(Math.round(s.reporting)))) + "</div>";
    // Toujours 3 lignes (les 3 premiers candidats renvoyés par l'API), complétées par des lignes vides
    var rows = (s.cands || []).slice(0, 3);
    while (rows.length < 3) rows.push(null);
    html += rows.map(function(c){
      if (!c) return '<div class="cand empty"><span class="nm">&nbsp;</span><span class="pc"></span><span class="tr"></span></div>';
      var k = partyKey(c.party), pc = num(c.percent);
      return '<div class="cand"><span class="nm">' + esc(c.name) + "<small>" + esc(c.party) + "</small>" +
        (c.winner ? '<span class="win">' + T.winner + "</span>" : "") + "</span>" +
        (noVotes ? '<span class="pc na">–</span>' : '<span class="pc">' + fmt(pc) + " %</span>") +
        '<span class="tr"><b style="width:' + (noVotes ? 0 : Math.min(100, pc)) + "%;background:" + COLORS[k].def + '"></b></span></div>';
    }).join("");
    $("detail").innerHTML = html;
  }

  function fmt(n){ return (Math.round(n * 10) / 10).toLocaleString(LANG === "de" ? "de-CH" : "fr-CH"); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]; }); }

  function renderGauge(c, total, majority, holdover){
    // c = { D, Dp, R, Rp, O } ; D/R incluent les sièges non renouvelés
    var pct = function(n){ return (n / total * 100).toFixed(3) + "%"; };
    var undecided = total - c.D - c.Dp - c.R - c.Rp - c.O;
    var unit = RACE === "governor" ? T.races : T.seats;
    var html =
      '<div class="gauge-head">' +
        '<div class="side d"><span class="n">' + c.D + '</span><span class="p">' + T.dem + "</span></div>" +
        '<div class="mid">' + (majority ? T.majority(majority) : T.govTotal(total)) + "</div>" +
        '<div class="side r"><span class="n">' + c.R + '</span><span class="p">' + T.rep + "</span></div>" +
      "</div>" +
      '<div class="bar" role="img" aria-label="' + T.dem + " " + c.D + ", " + T.rep + " " + c.R + '">' +
        '<span class="sd" style="width:' + pct(c.D) + '"></span>' +
        '<span class="sdp" style="width:' + pct(c.Dp) + '"></span>' +
        '<span class="sp"></span>' +
        (c.O ? '<span class="so" style="width:' + pct(c.O) + '"></span>' : "") +
        '<span class="srp" style="width:' + pct(c.Rp) + '"></span>' +
        '<span class="sr" style="width:' + pct(c.R) + '"></span>' +
        (majority ? '<span class="maj" style="left:calc(' + pct(majority - .5) + ' - 1px)"></span>' : "") +
      "</div>" +
      '<div class="gauge-foot"><span>' + (holdover ? T.notUp(holdover.D, holdover.R) : T.leading(c.Dp, c.Rp, unit)) + "</span>" +
        "<span>" + (c.O ? T.oth + " " + c.O + " · " : "") + T.undecided(undecided) + "</span></div>";
    $("gauge").innerHTML = html;
  }

  function process(races, at){
    if (DEMO) races = demoize(races);
    var states = {}, c = { D: 0, Dp: 0, R: 0, Rp: 0, O: 0 };

    if (RACE === "house") {
      var by = {};
      races.forEach(function(r){
        var s = summarize(r), b = by[r.province] || (by[r.province] = { D:0, R:0, O:0, Dp:0, Rp:0, total:0 });
        b.total++;
        if (s.status === "def") { b[s.party]++; c[s.party]++; }
        else if (s.status === "prov") { if (s.party === "D") { b.Dp++; c.Dp++; } else if (s.party === "R") { b.Rp++; c.Rp++; } }
      });
      Object.keys(by).forEach(function(st){
        var b = by[st], dAll = b.D + b.Dp, rAll = b.R + b.Rp;
        var st2 = { status: "pending", house: b };
        if (dAll || rAll) {
          var party = dAll > rAll ? "D" : rAll > dAll ? "R" : null;
          var decided = b.D + b.R + b.O === b.total;
          if (party) { st2.status = decided ? "def" : "prov"; st2.party = party; }
        }
        states[st] = st2;
      });
      renderGauge(c, 435, 218, null);
    } else {
      races.forEach(function(r){
        var s = summarize(r);
        if (states[r.province] && states[r.province].status !== "pending" && s.status === "pending") return;
        states[r.province] = s;
        if (s.status === "def") c[s.party]++;
        else if (s.status === "prov") { if (s.party === "D") c.Dp++; else if (s.party === "R") c.Rp++; }
      });
      if (RACE === "senate") {
        c.D += SENATE_HOLDOVER.D; c.R += SENATE_HOLDOVER.R;
        renderGauge(c, 100, 51, SENATE_HOLDOVER);
      } else {
        renderGauge(c, races.length, null, null);
      }
    }
    paint(states);
    $("updated").textContent = T.updated(hhmm(at || Date.now()));
  }
  function hhmm(ts){ return new Date(ts).toLocaleTimeString(LANG === "de" ? "de-CH" : "fr-CH", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Zurich" }); }

  // Affiche immédiatement les dernières données connues pour la course choisie
  function showCached(){
    var c = readCache(typeFor(RACE));
    if (c) { process(pick(c.races), c.at); $("map").classList.remove("loading"); return true; }
    return false;
  }

  var timer = null, inflight = 0;
  function refresh(){
    clearTimeout(timer);
    var id = ++inflight, delay = REFRESH_MS;
    load().then(function(races){
        if (id === inflight) { process(races); $("map").classList.remove("loading"); }
        prefetchOther();
      })
      .catch(function(){
        if (id !== inflight) return;
        delay = RETRY_MS;
        var c = readCache(typeFor(RACE));
        // Échec silencieux : si on a déjà des résultats, on garde simplement l'heure de leur dernière mise à jour
        if (c) $("updated").textContent = T.updated(hhmm(c.at));
        else $("updated").innerHTML = '<span class="err">' + T.error + "</span>";
      })
      .then(function(){ if (id === inflight) timer = setTimeout(refresh, delay); });
  }
  // Préchargement en arrière-plan de l'autre jeu de données (Sénat+Chambre <-> Gouverneurs),
  // pour que le changement d'onglet s'affiche immédiatement depuis le cache.
  var PREFETCH_MAX_AGE = 90000, prefetching = {};
  function prefetchOther(){
    var other = typeFor(RACE) === "General" ? "Statewide" : "General";
    var c = mem[other];
    if (prefetching[other] || (c && Date.now() - c.at < PREFETCH_MAX_AGE)) return;
    prefetching[other] = true;
    fetchType(other).catch(function(){}).then(function(){ prefetching[other] = false; });
  }

  // Sans données en cache pour la nouvelle course : carte neutre qui « respire » le temps du chargement
  function resetMap(){
    lastStates = {};
    document.querySelectorAll(".st").forEach(function(g){
      g.classList.remove("none");
      g.querySelector(".hex").style.fill = "";
      g.querySelector(".lab").setAttribute("class", "lab dark");
      drawStripes(g, null);
    });
    $("gauge").innerHTML = "";
    $("updated").textContent = T.loading;
    $("map").classList.add("loading");
  }
  function switchRace(){ if (!showCached()) resetMap(); refresh(); }

  // Thème imposé par la page parente (ex. site desktop en mode sombre) :
  // la page Blick peut envoyer iframe.contentWindow.postMessage({ midtermsTheme: "dark" }, "*")
  window.addEventListener("message", function(e){
    var t = e && e.data && e.data.midtermsTheme;
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    else if (t === "auto") document.documentElement.removeAttribute("data-theme");
  });

  renderChrome();
  buildMap();
  if (!showCached()) $("map").classList.add("loading");
  refresh();
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) refresh(); });
})();
</script>
